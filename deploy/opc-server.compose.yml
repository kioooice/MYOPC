# 服务器（124.222.190.89）使用的组合文件。
# 放在 /opt/apps/opc/deploy/ 下执行：
#   docker compose -f deploy/opc-server.compose.yml up -d --build
name: opc
services:
  myopc:
    build:
      context: ..
      args:
        DEBIAN_MIRROR: mirrors.tencent.com
    container_name: myopc
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      MYOPC_DATA_DIR: /data
      MYOPC_KNOWLEDGE_DIR: /knowledge
      MYOPC_KNOWLEDGE_REPO: kioooice/MYOPC-Knowledge
      MYOPC_KNOWLEDGE_COMMIT_FILE: /knowledge-commit.txt
    ports:
      - "127.0.0.1:3011:3000"
    volumes:
      - /opt/data/opc:/data
      - /opt/data/knowledge/myopc:/knowledge
      - /opt/data/knowledge/commit.txt:/knowledge-commit.txt:ro
      # 只读挂载知识仓库的 Deploy Key，容器里的同步需要自己 fetch（只读，不能推送）。
      - /root/.ssh/myopc-knowledge:/root/.ssh/myopc-knowledge:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro

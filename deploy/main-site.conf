server {
    listen 80;
    listen 443 ssl http2;
    server_name seizemoment.xyz;

    access_log /www/sites/main-site/log/access.log main;
    error_log /www/sites/main-site/log/error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location / {
        auth_basic "MYOPC";
        auth_basic_user_file /www/sites/main-site/auth/myopc.htpasswd;
        proxy_pass http://127.0.0.1:3010;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    ssl_certificate /www/sites/main-site/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/main-site/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
